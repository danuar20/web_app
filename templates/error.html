<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error {{ code }} — NetKPI Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d0d1a;
    color:#c8d0e0;
}
.error-box{
    text-align:center;
    max-width:480px;
    padding:2rem;
}
.error-code{
    font-size:6rem;
    font-weight:700;
    line-height:1;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:1rem;
}
.error-title{
    font-size:1.5rem;
    font-weight:600;
    margin-bottom:0.75rem;
    color:#c8d0e0;
}
.error-message{
    font-size:0.95rem;
    color:rgba(200,208,224,0.45);
    margin-bottom:2rem;
    line-height:1.6;
}
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    padding:0.75rem 1.5rem;
    border-radius:10px;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:#fff;
    font-weight:600;
    font-size:0.9rem;
    text-decoration:none;
    transition:opacity 0.2s,box-shadow 0.2s,transform 0.15s;
    box-shadow:0 4px 16px rgba(79,172,254,0.3);
}
.home-btn:hover{opacity:0.85;transform:translateY(-1px);box-shadow:0 8px 24px rgba(79,172,254,0.4);}
</style>
</head>
<body>
<div class="error-box">
    <div class="error-code">{{ code }}</div>
    <div class="error-title">{% if code == 404 %}Page Not Found{% else %}Something Went Wrong{% endif %}</div>
    <p class="error-message">{{ message }}</p>
    <a href="/" class="home-btn">
        <i class="fas fa-home"></i> Back to Login
    </a>
</div>
</body>
</html>
